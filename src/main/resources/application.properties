spring.application.name=scout-management
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/scout-management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

pagos.importe.afiliacion=5000
pagos.importe.cuota-mensual=10000
pagos.bootstrap.enabled=true
pagos.cuota-mensual.mes-inicio-generacion=3
cursos.estados-actualizador.enabled=true
cursos.estados-actualizador.cron=0 0 3 ? * MON

